# Runs the same checks a developer runs locally (see "Tests" in the README).
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: osmls
          POSTGRES_PASSWORD: osmls
          POSTGRES_DB: osmls
        ports:
          # The port .env.example expects.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U osmls -d osmls"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Development-only values; the checks need no secrets.
      - name: Configure
        run: cp .env.example .env

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Rules, validation, and database tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:e2e

      - name: Keep browser test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
