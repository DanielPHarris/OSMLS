# `docker compose up` starts the database and the application with synthetic data.
# `docker compose up -d db` starts only the database, for local development.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: osmls
      POSTGRES_PASSWORD: osmls
      POSTGRES_DB: osmls
    ports:
      - "${OSMLS_DB_PORT:-5433}:5432"
    volumes:
      - osmls-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osmls -d osmls"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A mail catcher for the demo and the tests: it accepts every email and delivers
  # none. Read what was "sent" at http://localhost:8025.
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "${OSMLS_SMTP_PORT:-1025}:1025"
      - "${OSMLS_MAIL_PORT:-8025}:8025"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://osmls:osmls@db:5432/osmls
      BETTER_AUTH_SECRET: dev-only-secret-change-me-before-any-real-use
      BETTER_AUTH_URL: http://localhost:${OSMLS_PORT:-3000}
      MEDIA_DIR: /data/media
      DEMO_PASSWORD: osmls-demo-password
      SMTP_URL: smtp://mail:1025
      MAIL_FROM: OSMLS demo <no-reply@osmls.example>
      # Monitoring. The same three values go to the scheduled command below, so
      # that the Operations screen and the reports agree.
      OPS_EMAIL: ${OPS_EMAIL:-}
      BACKUP_OVERDUE_HOURS: ${BACKUP_OVERDUE_HOURS:-}
      SCHEDULED_OVERDUE_HOURS: ${SCHEDULED_OVERDUE_HOURS:-}
      # Any MapLibre-compatible style URL. Empty means the demo default.
      MAP_STYLE_URL: ${MAP_STYLE_URL:-}
    ports:
      - "${OSMLS_PORT:-3000}:3000"
    volumes:
      # The same folder local development uses (MEDIA_DIR=./data/media), although
      # the two have different databases. That is why backup runs delete no files
      # here until the folder is given to one database: see "Backup and recovery"
      # in docs/operations.md.
      - ./data/media:/data/media

  # Sends due saved-search alerts, tidies expired links and import previews,
  # and emails OPS_EMAIL when something is wrong, once an hour. A real
  # installation would schedule `pnpm alerts:send` however it schedules jobs.
  # Nothing here notices if this stops: see "Monitoring" in docs/operations.md.
  alerts:
    build: .
    depends_on:
      - app
    environment:
      DATABASE_URL: postgres://osmls:osmls@db:5432/osmls
      BETTER_AUTH_SECRET: dev-only-secret-change-me-before-any-real-use
      BETTER_AUTH_URL: http://localhost:${OSMLS_PORT:-3000}
      SMTP_URL: smtp://mail:1025
      MAIL_FROM: OSMLS demo <no-reply@osmls.example>
      OPS_EMAIL: ${OPS_EMAIL:-}
      BACKUP_OVERDUE_HOURS: ${BACKUP_OVERDUE_HOURS:-}
      SCHEDULED_OVERDUE_HOURS: ${SCHEDULED_OVERDUE_HOURS:-}
      # The folder the application stores files in, so that this can tell
      # whether it can be written to.
      MEDIA_DIR: /data/media
    volumes:
      - ./data/media:/data/media
    command: ["sh", "-c", "while true; do sleep 3600; pnpm alerts:send; done"]

  # Takes a backup of the database and the photo and document files together,
  # once a day, keeps the last 14, and then deletes files no record refers to
  # any more, if the media folder has been given to this database with
  # `docker compose run --rm backup pnpm media:claim`. Backups are written to ./data/backups on this machine: copying
  # them somewhere else is for the installation to arrange.
  backup:
    build: .
    depends_on:
      - app
    environment:
      DATABASE_URL: postgres://osmls:osmls@db:5432/osmls
      MEDIA_DIR: /data/media
      BACKUP_DIR: /data/backups
      BACKUP_KEEP: "14"
    volumes:
      - ./data/media:/data/media
      - ./data/backups:/data/backups
    command: ["sh", "-c", "while true; do sleep 86400; pnpm backup; done"]

volumes:
  osmls-db:
